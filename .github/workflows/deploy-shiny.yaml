on: 
  push:
    branches: [master, main]

name: deploy-shiny

jobs:
  deploy-shiny:
    runs-on: ubuntu-latest
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: "https://packagemanager.rstudio.com/cran/__linux__/noble/latest"
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install shiny
        run: |
          install.packages(c("curl", "shiny", "rsconnect", "remotes", "pkgbuild")); remotes::install_deps(dependencies = TRUE) 
        shell: Rscript {0}
      - name: Push to Posit Connect Cloud
        run: |
          rsconnect::connectCloudClientCredentials(account='nathansam', clientId=${{secrets.CLIENTID}}, clientSecret=${{secrets.CLIENTSECRET}});
          apps <- rsconnect::cloudApps();
          existing <- apps[apps$name == 'datefixr', ];
          if (nrow(existing) > 0) {
            rsconnect::deployApp(appId = existing$id, appTitle = 'datefixr');
          } else {
            rsconnect::deployApp(appName = 'datefixr', appTitle = 'datefixr');
          }
        shell: Rscript {0}